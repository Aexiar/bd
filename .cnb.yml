master:
  push:
    - imports: https://cnb.cool/Aurorxa/passkey/-/blob/main/envs.yml
      stages:
        - name: 构建当前项目
          image: node:24
          script: |
            npm install -g pnpm@10
            pnpm config set shamefully-hoist true
            pnpm config set public-hoist-pattern *
            pnpm install --no-frozen-lockfile
            pnpm run docs:build
        - name: 部署到 Pages
          image: node:24
          script: |
            # EdgeOne 部署重试，最多 3 次
            for attempt in 1 2 3; do
              echo "=== EdgeOne 部署第 $attempt 次尝试 ==="
              if npx edgeone pages deploy ./docs/.vitepress/dist \
                --name vitepress-bd \
                --token $EDGEONE_API_TOKEN --json ; then
                echo "=== 部署成功 ==="
                exit 0
              fi
              echo "=== 部署失败，等待后重试... ==="
              [ "$attempt" -lt 3 ] && sleep 15
            done
            exit 1