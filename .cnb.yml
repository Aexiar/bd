master:
  push:
    - imports: https://cnb.cool/Aurorxa/passkey/-/blob/main/envs.yml
      stages:
        - name: 构建当前项目
          image: node:24
          script: |
            npm install -g pnpm@10
            npm config set shamefully-hoist true
            pnpm config set public-hoist-pattern *
            pnpm install --no-frozen-lockfile
            pnpm run docs:build
        - name: 部署到 Pages
          image: node:24
          script: |
             ls -la ./docs/.vitepress/dist 
             npx edgeone@1.5.9 pages deploy ./docs/.vitepress/dist --name vitepress-bd --token $EDGEONE_API_TOKEN